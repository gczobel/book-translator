[project]
name = "book-translator"
version = "0.1.0"
description = "Multi-pass literary book translator: EPUB in, translated EPUB out, LLM doing the human work"
authors = [
    { name = "Gustavo", email = "754466+gczobel@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fonttools>=4.68.0",
    "lxml>=6.1.3",
    "pydantic>=2.14.4",
    "pydantic-ai-slim[anthropic]>=2.71.0",
    "pyyaml>=6.0.4",
]

[project.scripts]
book-translator = "book_translator:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.4",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
    "zizmor>=1.33.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".github/scripts"]
markers = ["e2e: end-to-end CLI tests on a fixture EPUB (the e2e required check)"]

[tool.mypy]
strict = true
files = ["src", "tests", ".github/scripts"]
mypy_path = ["src", "tests", ".github/scripts"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true  # fontTools ships no type information

[tool.ruff]
line-length = 100
src = ["src", "tests", ".github/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
# Resolver-level cooldown (ADR 0005): ignore any release younger than 7 days, including
# indirect ones that Dependabot's own cooldown never sees.
exclude-newer = "7 days"
# TEMPORARY: these four were already locked when the cooldown was added and were younger than
# 7 days (uploaded 2026-11-20 pyyaml, 11-22 types-pyyaml and zizmor, 11-23 packaging), so the lock
# would not resolve. The "1 day" is a rolling window, not a pin. Delete this line after
# 2026-11-30, once they have aged.
exclude-newer-package = { pyyaml = "1 day", types-pyyaml = "1 day", zizmor = "1 day", packaging = "1 day" }
