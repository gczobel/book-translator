[project]
name = "book-translator"
version = "0.1.0"
description = "Multi-pass literary book translator: EPUB in, translated EPUB out, LLM doing the human work"
authors = [
    { name = "Gustavo", email = "754466+gczobel@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
book-translator = "book_translator:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "zizmor>=1.33.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".github/scripts"]

[tool.mypy]
strict = true
files = ["src", "tests", ".github/scripts"]
mypy_path = ["src", ".github/scripts"]
explicit_package_bases = true

[tool.ruff]
line-length = 100
src = ["src", "tests", ".github/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
