name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; each job asks for what it needs (ADR 0005).
permissions: {}

# Layout: each worker job does the work; each required check is a separate
# aggregator job with a name unique across workflows. The aggregator fails
# unless every upstream job succeeded, so a skipped, cancelled or neutral
# result can never pass. Required checks (see the ruleset): lint, typecheck,
# test, e2e, epubcheck.
#
# The aggregator script is repeated on purpose. Calling a shared action or
# workflow would need a checkout, so a PR could change the gate it is judged by.
# Do not factor it out.
jobs:
  run-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv is pinned by version and checksum so the runtime download can't bypass pinning.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.21"
          checksum: "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  lint:
    name: lint
    needs: [run-lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every upstream job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          [[ -n "$RESULTS" ]] || exit 1
          for r in $RESULTS; do [[ "$r" == success ]] || exit 1; done

  run-typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.21"
          checksum: "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050"
      - run: uv sync --locked
      - run: uv run mypy

  typecheck:
    name: typecheck
    needs: [run-typecheck]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every upstream job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          [[ -n "$RESULTS" ]] || exit 1
          for r in $RESULTS; do [[ "$r" == success ]] || exit 1; done

  run-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.21"
          checksum: "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050"
      - run: uv sync --locked
      - run: uv run pytest

  test:
    name: test
    needs: [run-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every upstream job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          [[ -n "$RESULTS" ]] || exit 1
          for r in $RESULTS; do [[ "$r" == success ]] || exit 1; done

  run-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv is pinned by version and checksum so the runtime download can't bypass pinning.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.21"
          checksum: "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050"
      - run: uv sync --locked
      - run: uv run pytest -m e2e

  e2e:
    name: e2e
    needs: [run-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every upstream job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          [[ -n "$RESULTS" ]] || exit 1
          for r in $RESULTS; do [[ "$r" == success ]] || exit 1; done

  run-epubcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv is pinned by version and checksum so the runtime download can't bypass pinning.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.21"
          checksum: "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050"
      - run: uv sync --locked
      - name: Install epubcheck (pinned by version and checksum in the script)
        run: |
          . scripts/epubcheck.pin
          scripts/install-epubcheck "$RUNNER_TEMP/ec"
          echo "EPUBCHECK=$RUNNER_TEMP/ec/share/epubcheck/$EPUBCHECK_VERSION/epubcheck.jar" >> "$GITHUB_ENV"
      - run: java -version && uv run pytest -m epubcheck

  epubcheck:
    name: epubcheck
    needs: [run-epubcheck]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every upstream job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          [[ -n "$RESULTS" ]] || exit 1
          for r in $RESULTS; do [[ "$r" == success ]] || exit 1; done
