name: escalate

# Manual trigger, for the owner to test the escalation loop (the live check, ticket #27).
#
# Unattended workflows escalate from one of their own jobs, using the action, because
# environment secrets are not available inside a called reusable workflow:
#
#   escalate:
#     needs: [the-jobs]
#     if: ${{ failure() || cancelled() }}
#     runs-on: ubuntu-latest
#     environment: maintenance   # main-only; so callers run in the main context
#     permissions:
#       contents: read
#     steps:
#       - uses: actions/checkout@<pin>
#         with:
#           persist-credentials: false
#       - uses: ./.github/actions/escalate
#         with:
#           reason: workflow-failed
#           key: some-problem-key
#           app-id: ${{ vars.MAINT_APP_ID }}
#           private-key: ${{ secrets.MAINT_APP_PRIVATE_KEY }}
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason code
        type: choice
        options: [selftest, workflow-failed, pause-unreadable]
        default: selftest
      key:
        description: Problem key
        type: string
        default: selftest
      ref:
        description: Related PR or issue number (optional)
        type: string
        default: ""

# Least privilege by default; each job asks for what it needs (ADR 0005).
permissions: {}

# Two runs for the same problem queue up instead of both missing the issue and opening two.
concurrency:
  group: escalate-${{ inputs.key }}
  cancel-in-progress: false

jobs:
  escalate:
    runs-on: ubuntu-latest
    environment: maintenance
    permissions:
      contents: read
    steps:
      # Scripts come from the ref this runs on, which the environment limits to main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/escalate # zizmor: ignore[self-repository] actionlint 1.7.12 can't parse `$/` yet; switch then
        with:
          reason: ${{ inputs.reason }}
          key: ${{ inputs.key }}
          ref: ${{ inputs.ref }}
          app-id: ${{ vars.MAINT_APP_ID }}
          private-key: ${{ secrets.MAINT_APP_PRIVATE_KEY }}
